# values.yaml
image:
  repository: fullaware/asteroidmining
  tag: latest
  pullPolicy: Always

# MongoDB Community Edition (via Bitnami)
# This chart deploys MongoDB Community Edition, the open-source NoSQL database.
# Bitnami provides the Helm chart packaging for Kubernetes deployments.
mongodb:
  enabled: true
  auth:
    rootPassword: Candy123
    username: root
    password: Candy123
    database: asteroidmining_db
  replicaSet:
    enabled: false
  primary:
    persistence:
      enabled: true
      storageClass: ""
      size: 300Mi